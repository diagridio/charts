{{- $llm := (((.Values.agent).reagent).llm) | default dict -}}
{{- if and $llm.apiKey (not (($llm.existingSecret).name)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent.reagentLLMSecretName" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
type: Opaque
data:
  api_key: {{ $llm.apiKey | b64enc | quote }}
{{- end }}
