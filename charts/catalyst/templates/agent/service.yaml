apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent.name" . }}
  annotations: 
{{- with .Values.agent.podAnnotations }}
{{ toYaml . | nindent 4 }}
{{- end }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  type: {{ .Values.agent.service.type }}
  ports:
    - name: cra-agent-metrics
      port: {{ .Values.agent.service.port }}
      protocol: TCP
      targetPort: {{ .Values.agent.metrics.port }}
    # The agent's probe port. The gateway publishes one path to it,
    # "/diagrid/region/writable", rewritten to this port's "/writable"; the
    # other probes on this port stay private to the cluster. Fixed rather than
    # configurable, and must match DefaultCatalystAgentProbesPort in
    # services/catalyst/gateway/main.go — that constant is what the gateway
    # dials, so an override here would silently be unroutable.
    - name: cra-agent-probes
      port: 8080
      protocol: TCP
      targetPort: probes
  selector:
    {{- include "agent.selectorLabels" . | nindent 6 }}
