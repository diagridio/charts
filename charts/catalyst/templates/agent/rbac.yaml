apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "agent.serviceAccountName" . }}
rules:
# ─────────────────────────────────────────────────────────────────────────────
# Agent binary — direct kubernetes client calls (non-Helm)
# ─────────────────────────────────────────────────────────────────────────────

# Project namespaces — get/list/watch always; create/delete/patch only when the
# agent owns the namespace lifecycle. When project.externally_managed_namespaces is
# true the namespace is pre-provisioned and reaped by an external owner, so the
# agent needs none of the three.
# `watch` is required for no-escalation when installing the Dapr chart
# (dapr-scheduler ClusterRole grants namespaces:{get,list,watch}).
# `patch` is required because the namespace release reconciles an EXISTING project
# namespace, not just creates a new one: the rendered manifest carries labels, so
# changing them (or bumping namespaceVersion, which re-reconciles every project)
# applies as a patch. Without it every sync fails at its first step, and the Helm
# rollback that follows fails the same way. See the region_usage block below,
# which needs patch on infra namespaces for an unrelated reason.
- apiGroups: [""]
  resources: ["namespaces"]
  {{- if .Values.agent.config.project.externally_managed_namespaces }}
  verbs: ["get", "list", "watch"]
  {{- else }}
  verbs: ["get", "list", "watch", "create", "delete", "patch"]
  {{- end }}

# Leader-election lease for the agent itself (cra-agent namespace).
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# ─────────────────────────────────────────────────────────────────────────────
# Helm installer + dynamic client — cluster-wide because target namespaces
# span cra-agent, root-dapr-system, shared-{kafka,postgresql}, prj-*, default
# (the namespace chart is installed from the 'default' Helm namespace).
# ─────────────────────────────────────────────────────────────────────────────

# Core resources installed by the Dapr, vcluster, OTel collector, Kafka,
# PostgreSQL, Redis, CRA sidecar, component, and namespace charts. The
# agent also reads pull secrets / infra passwords from arbitrary namespaces
# and syncs pull secrets to project namespaces.
#
# The release-availability publisher's ConfigMap write rides on this rule too
# (as the region-details ConfigMap already does). It needs no grant of its own,
# and adding one gated on the feature would be a second rule saying what this
# one already says.
#
# Cluster-wide secrets get/list/watch cannot be narrowed here while the root
# Dapr install renders dapr-operator-admin, which grants exactly that; the
# agent must hold it for no-escalation. Narrowing the writes needs a Role bound
# in each project namespace.
- apiGroups: [""]
  resources: ["configmaps", "secrets", "services", "serviceaccounts"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Helm --wait polls pod readiness during install/upgrade. The agent never
# creates pods directly (Deployments/StatefulSets do). `delete` is required
# for no-escalation when installing the Dapr chart (dapr-operator-admin
# ClusterRole grants pods:{get,list,watch,delete}).
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "delete"]

# pods/log is a subresource and must be granted separately. The agent reads
# pod logs in the on-error handler to surface failure details.
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]

{{- if dig "region_usage" "enabled" false .Values.agent.config }}
# Region CPU-usage collector (pkg/regionusage) lists PodMetrics from the
# cluster metrics-server (metrics.k8s.io) across all Catalyst-managed namespaces
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list"]
# The collector only measures namespaces carrying the cra.diagrid.io/managed
# marker. ensureNamespace backfills that marker onto pre-existing infra
# namespaces (root-dapr-system, shared-*, cra-agent) via a merge patch, which
# needs patch on namespaces
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["patch"]
{{- end }}

# PVCs are touched in two flows:
#   * teardown — single delete (vcluster handler) and deletecollection by
#     label selector for dapr-scheduler-server / dapr-placement-server
#     StatefulSets;
#   * boot — get on shared-postgresql/data-shared-postgresql-0 to detect a
#     data directory left behind after a chart uninstall, so the agent can
#     refuse to seed a fresh admin password against an existing pg_authid
#     (see internal/infra/postgresql.hasOrphanPVC).
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "delete", "deletecollection"]

# Helm emits events during chart operations.
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]

# Workloads installed by Dapr control plane, OTel collectors, Kafka,
# PostgreSQL, Redis, and CRA sidecar charts. `deployments` also needs patch
# for the dynamic-client sidecar-restart on trust-bundle rotation.
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# ReplicaSets are owned by Deployments; Helm --wait reads them.
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "list", "watch"]

# Finalizer subresources — required for no-escalation when installing the
# Dapr chart (dapr-operator-admin grants {deployments,statefulsets}/finalizers
# and services/finalizers with the verbs below).
- apiGroups: ["apps"]
  resources: ["deployments/finalizers", "statefulsets/finalizers"]
  verbs: ["get", "list", "watch", "update"]
- apiGroups: [""]
  resources: ["services/finalizers"]
  verbs: ["get", "list", "watch", "create", "update"]

# TokenReview — required for no-escalation when installing the Dapr chart
# (dapr-sentry ClusterRole grants tokenreviews:create).
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]

# HPA for the CRA sidecar chart.
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# PodDisruptionBudget for the Dapr chart and the per-App-ID sidecar chart.
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# CronJob/Job for the Dapr jwt-key-rotation chart.
- apiGroups: ["batch"]
  resources: ["cronjobs", "jobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# NetworkPolicies created by the per-project namespace chart.
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Per-sidecar Role/RoleBinding (CRA chart) plus ClusterRole/ClusterRoleBinding
# installed by the Dapr chart and the OTel collectors.
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Dapr resources: per-project components/configurations/subscriptions/
# resiliencies/httpendpoints (dapr-component, dapr-resource, and
# dynamic-artifact-release charts), plus the agent's own
# createDaprConfiguration in cra-agent. `mcpservers` and
# `workflowaccesspolicies` are granted to dapr-operator-admin in newer Dapr
# charts (required for no-escalation).
- apiGroups: ["dapr.io"]
  resources: ["components", "configurations", "subscriptions", "resiliencies", "httpendpoints", "mcpservers", "workflowaccesspolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Dapr CRDs: Helm creates them from the Dapr chart's crds/ directory, and
# ApplyDaprCRDs gets each one and server-side applies (patch) any drift.
# Nothing in the agent lists, watches, updates or deletes a CRD. The rule
# cannot carry resourceNames: `create` is never name-restricted, and
# dapr-operator-admin grants get and patch on every CRD, which the agent must
# hold unrestricted to satisfy no-escalation.
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "create", "patch"]

# The agent installs Dapr with the sidecar injector disabled, so no chart it
# installs renders a webhook configuration. The dapr-injector ClusterRole still
# grants patch on the dapr-sidecar-injector webhook, which the agent must hold
# for no-escalation; get and delete let Helm clean up a copy an older release
# left behind. No other webhook configuration is reachable.
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["mutatingwebhookconfigurations"]
  resourceNames: ["dapr-sidecar-injector"]
  verbs: ["get", "patch", "delete"]

# EndpointSlice for the "kubernetes" service in the default namespace is read
# when building NetworkPolicy rules to allow access to the K8s API server.
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get"]

# Upstream kubernetes-sigs/agent-sandbox CRs the gVisor sandbox Provider
# materializes per-project.
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Argo CD Applications, read-only (internal/deliveryobservation). The agent
# reports what the region's Argo CD says it delivered (RFC 0033 §12.1) on its
# outbound status channel, because the control plane cannot dial into a BYOC or
# private dedicated region to read it itself. The collector lists; get and watch
# complete the standard read-only set and expose nothing a list does not
# already. Nothing in the agent writes an Application. A region with no Argo CD
# has no Applications and the rule is inert there, so it is ungated.
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "list", "watch"]

# Cluster-scoped RuntimeClass read access — the gVisor sandbox Provider's
# Preflight check verifies the configured RuntimeClass is registered
# before any Sandbox is created. Granted with `get` only (no list/watch)
# because the agent only ever reads the named class once at boot.
- apiGroups: ["node.k8s.io"]
  resources: ["runtimeclasses"]
  verbs: ["get"]

{{- $releaseAvailabilityReaders := dig "release_availability" "readers" (list) .Values.agent.config }}
{{- /* Gated on the publisher being enabled as well as on a reader being named:
       a reader named while the publisher is off would be granted access to a
       ConfigMap that is never written. */ -}}
{{- if and $releaseAvailabilityReaders (dig "release_availability" "enabled" false .Values.agent.config) }}
---
# Read access to the one ConfigMap the release-availability publisher writes,
# for the region operator's own tooling.
#
# This is NOT for the agent — the agent writes the ConfigMap through the
# ClusterRole above. It exists because the whole point of publishing the answer
# is that tooling holding no Diagrid credential can read it, and the least
# privilege that allows is `get` on a single named object in a single
# namespace. `list` and `watch` are deliberately absent: neither can be
# restricted to a resource name, so granting them would widen this to every
# ConfigMap in the namespace, which is where the agent keeps the region's join
# details.
#
# The Role and its binding are rendered TOGETHER, from agent.config
# .release_availability.readers, and neither is rendered when no reader is
# named. A Role nothing binds grants nothing, and leaving one behind would mean
# an operator had to look up its generated name to bind it themselves — which
# is the moment somebody grants `list` on the whole namespace instead because
# it is easier. Naming the reader here is the narrow path AND the short one.
#
# An operator who keeps RBAC out of this chart names nobody and writes both
# halves; the release channels guide carries the YAML.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent.serviceAccountName" . }}-release-availability-reader
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["catalyst-release-availability"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent.serviceAccountName" . }}-release-availability-reader
  namespace: {{ .Release.Namespace }}
subjects:
{{- range $releaseAvailabilityReaders }}
  - kind: {{ .kind | default "ServiceAccount" }}
    name: {{ required "a release_availability reader needs a name" .name }}
    {{- if or (eq (.kind | default "ServiceAccount") "ServiceAccount") .namespace }}
    namespace: {{ .namespace | default $.Release.Namespace }}
    {{- end }}
{{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agent.serviceAccountName" . }}-release-availability-reader
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agent.serviceAccountName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "agent.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "agent.serviceAccountName" . }}
  apiGroup: rbac.authorization.k8s.io
