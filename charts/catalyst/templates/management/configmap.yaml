{{- include "management.validateValues" . -}}
{{- $configMap := deepCopy .Values.management.config -}}
{{- $_ := set $configMap "control_plane_namespace" .Values.global.control_plane_namespace -}}
{{- $_ := set $configMap "control_plane_url" .Values.global.control_plane_url -}}
{{- $_ := set $configMap "control_plane_http_url" .Values.global.control_plane_http_url -}}
{{- $_ := set $configMap "control_plane_http_insecure" .Values.global.control_plane_http_insecure -}}
{{- $_ := set $configMap "sentry" .Values.global.sentry -}}
{{- $_ := set $configMap "nats" .Values.global.nats -}}
{{- $_ := set $configMap "secretsprovider" .Values.global.secrets.provider -}}
{{- $_ := set $configMap "secrets_redis" .Values.global.secrets.redis -}}
{{- $_ := set $configMap "secrets_aws_secretmanager" .Values.global.secrets.aws -}}
{{- if and (eq .Values.global.secrets.provider "postgresql") (not .Values.global.secrets.postgresql.existingSecret) -}}
  {{- $_ := set $configMap "secrets_postgresql" .Values.global.secrets.postgresql -}}
{{- end -}}
{{- /* Feature flags come from two surfaces, merged rather than replaced.

       global.featureflags is chart-wide and MUST be delivered whole to both the
       agent and management ConfigMaps. Flag names are namespaced per consumer in
       code (featureflags.sidecar.* read by the agent, featureflags.management.*
       read by management), but the pre-split flat namespace (featureflags.<flag>)
       is still honored as a fallback — see ReconcileLegacy in
       services/catalyst/pkg/config/featureflags/provider.go. A flat key carries
       no scope, so the chart cannot tell which service owns it; routing would
       require duplicating the Go-side flag->scope tables here, which would drift.
       Instead each service is handed the whole map and picks out the names it
       owns, ignoring the rest.

       management.config.featureflags is the per-service surface and wins on key
       collision, matching the "more specific overrides" convention documented for
       shared.scheduling in values.yaml. It accepts either shape: scoped
       (management.workflow_active_metrics) resolves at top precedence, flat
       (workflow_active_metrics) resolves via the legacy fallback.

       deepCopy is required because merge mutates its first argument, which would
       otherwise corrupt .Values for every template rendered after this one. */ -}}
{{- $_ := set $configMap "featureflags" (merge (deepCopy (.Values.management.config.featureflags | default dict)) (.Values.global.featureflags | default dict)) -}}
{{- /* Derive connect-only access to the shared region database (db_region) from
       the agent's managed Postgres credentials, so no separate management value
       is required: the agent provisions db_region with these same region master
       credentials, and management only ever connects to it (no DDL).

       This MUST mirror the agent's own resolveManagedPostgresqlConfig
       (services/catalyst/agent/internal/boot/regiondb.go): the agent prefers the
       shared self-hosted Postgres (only present when
       default_managed_state_store_type == postgresql-shared-selfhosted) and
       otherwise falls back to project.external_postgresql whenever it is enabled
       — independent of the state-store type (e.g. external Postgres configured
       for the scheduler's managed-postgresql backend). We therefore key the
       self-hosted branch off the state-store type and the external branch off
       external_postgresql.enabled, in that precedence order.

       An explicit management.config.region_postgresql, if set, always wins. */ -}}
{{- /* Consume the shared resolver so this derivation sees the SAME resolved
       state store the agent ConfigMap emits (the friendly global.postgresql
       surface, or a legacy passthrough), never the raw .Values. */ -}}
{{- $resolved := include "catalyst.resolvedInfra" . | fromYaml -}}
{{- $ss := $resolved.stateStore -}}
{{- $extPg := $ss.external | default dict -}}
{{- if not (hasKey $configMap "region_postgresql") -}}
  {{- /* Self-hosted path (e.g. onebox), checked first to match the agent's
         preference. Rather than hardcoding the agent's Bitnami coordinates here,
         we only propagate the managed state store type: management derives the
         host/port/username/secret/password-key in code from the shared
         conventions (services/catalyst/pkg/sharedpostgresql), the same source
         the agent uses. This keeps the two from drifting. */ -}}
  {{- if eq $ss.type "postgresql-shared-selfhosted" -}}
    {{- $_ := set $configMap "region_postgresql" (dict
        "enabled" true
        "managed_state_store_type" $ss.type
      ) -}}
  {{- /* External path: the agent uses project.external_postgresql whenever it is
         enabled, and management reuses the same region master credentials to
         connect to db_region. Two credential shapes are supported, mirroring the
         agent (services/catalyst/agent/pkg/config/postgresql):

           1. existing_secret_name — the secret carries the full connection tuple
              (keys: host, port, username, password); management reads it at
              startup (region.Config.ResolveSecret).
           2. inline connectionString — connection_string_host/port/username/
              password set directly on the values; we map them onto the region
              config's host/port/username/password, so no secret is required.

         disable_tls/max_conns are propagated from the same external block so
         management's connection settings track the agent's exactly. AWS IAM auth
         (no static password) can't be auto-derived — set an explicit
         management.config.region_postgresql override in that case. The region
         database name is a fixed invariant owned by the agent
         (mcpstore.RegionDatabaseName), so it is not set here. */ -}}
  {{- else if and (dig "enabled" false $extPg) (dig "existing_secret_name" "" $extPg) -}}
    {{- $_ := set $configMap "region_postgresql" (dict
        "enabled" true
        "disable_tls" (dig "disable_tls" false $extPg)
        "max_conns" (dig "max_conns" 2 $extPg)
        "existing_secret_name" $extPg.existing_secret_name
        "existing_secret_namespace" (default .Release.Namespace (dig "existing_secret_namespace" "" $extPg))
      ) -}}
  {{- else if and (dig "enabled" false $extPg) (dig "connection_string_host" "" $extPg) (dig "connection_string_password" "" $extPg) -}}
    {{- $_ := set $configMap "region_postgresql" (dict
        "enabled" true
        "disable_tls" (dig "disable_tls" false $extPg)
        "max_conns" (dig "max_conns" 2 $extPg)
        "host" $extPg.connection_string_host
        "port" (dig "connection_string_port" 5432 $extPg)
        "username" (dig "connection_string_username" "" $extPg)
        "password" $extPg.connection_string_password
      ) -}}
  {{- end -}}
{{- end -}}
{{- /* Derive the mediated LLM token-budget counter from the agent's rate-limit
       service, so a region enables the counter in one place. The agent installs
       that service (agent.config.project.ratelimit_service) and management is
       the only component permitted to reach it — its NetworkPolicy admits this
       namespace alone, because the Envoy rate-limit protocol authorizes no
       caller. The endpoint is deterministic: the agent pins the release name
       and namespace (services/catalyst/agent/internal/infra/ratelimitshared),
       so there is no value to plumb through and nothing to keep in sync beyond
       these names.

       An explicit management.config.token_budget_counter always wins, which is
       the escape hatch for a counter deployed outside the agent's control. */ -}}
{{- $rls := dig "config" "project" "ratelimit_service" dict (.Values.agent | default dict) -}}
{{- if and (not (hasKey $configMap "token_budget_counter")) (dig "enabled" false $rls) -}}
  {{- $_ := set $configMap "token_budget_counter" (dict
      "enabled" true
      "endpoint" "shared-ratelimit-rls.shared-ratelimit-redis.svc.cluster.local:8081"
    ) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "management.name" . }}-config
data:
  "config.yaml": |
{{ tpl (toYaml $configMap) . | indent 4 }}
