suite: Test the agent's gateway probe port resolution
templates:
  - agent/configmap.yaml

tests:
  # The probe targets the gateway service, so the port it uses is derived from
  # that service rather than restated, or the two silently drift and every probe
  # fails against a closed port.
  - it: should derive the probe port from the gateway service port
    set:
      join_token: "test-token"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "gateway_probe:\\s+enabled: true\\s+interval_in_sec: 30\\s+port: 8080"

  - it: should follow a changed gateway service port
    set:
      join_token: "test-token"
      gateway.envoy.service.port: 18080
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "gateway_probe:\\s+enabled: true\\s+interval_in_sec: 30\\s+port: 18080"

  - it: should let an explicit probe port win
    set:
      join_token: "test-token"
      agent.config.gateway_probe.port: 9999
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "gateway_probe:\\s+enabled: true\\s+interval_in_sec: 30\\s+port: 9999"

  - it: should carry an operator's decision to turn the probe off
    set:
      join_token: "test-token"
      agent.config.gateway_probe.enabled: false
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "gateway_probe:\\s+enabled: false"
